<!DOCTYPE html>

</head>
<body class="flex justify-center min-h-screen bg-gray-900">

  <div id="app" class="w-full max-w-[430px] min-h-screen bg-[#F8FAFC] text-gray-900 relative shadow-2xl flex flex-col overflow-x-hidden"></div>

  <!-- Toast Banner -->

    <span id="toast-msg"></span>

<script>
const STORAGE_KEY = 'panasport_qatar_html_v1';

const PITCH_IMAGES = [

    }
  ],

    },

    },

  ],

    { matchId: 'm1', playerName: 'Omar Nasser', phone: '+974 7712 0091' }
  ],
  notifications: [
    { id: 'n1', role: 'owner', text: 'New Fawran receipt (225 QAR) from Youssef Mansour for Doha Night 6v6.', time: 'Just now', unread: true },
    { id: 'n2', role: 'player', text: 'Your pass #PS-8410 for Doha Night 6v6 is CONFIRMED!', time: '10m ago', unread: true },
    { id: 'n3', role: 'player', text: '4K Match Video is now ready for Katara Hills Late Night 6v6.', time: '1d ago', unread: false }
  ],
  modal: null // { type: 'book'|'create_game'|'edit_video'|'squad_sheet', matchId?, bookingMode?, spots?, payMethod?, receiptFile?, teamName?, squadSheetText? }
};

let state = loadState();

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return { ...DEFAULT_STATE, ...JSON.parse(saved), modal: null };
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}

function saveState() {
  try {
    const toSave = { ...state, modal: null };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch (e) {}
}

function showToast(msg) {
  const el = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.add('hidden'), 3200);
}

function copyText(txt, label) {
  if (navigator.clipboard) navigator.clipboard.writeText(txt);
  showToast(`Copied ${label}: ${txt}`);
}

function getTakenSpots(matchId) {
  return state.bookings
    .filter(b => b.matchId === matchId && b.status !== 'rejected' && b.status !== 'cancelled')
    .reduce((sum, b) => sum + Number(b.spots || 1), 0);
}

// --- AUTH ACTIONS ---
function loginAsPlayerDemo() {
  state.user = {
    role: 'player',
    name: 'Tariq Al-Kuwari',
    phone: '+974 5541 2290',
    position: 'CM',
    ovr: 86,
    goals: 14,
    assists: 19
  };
  state.activeTab = 'games';
  saveState();
  render();
  showToast('Welcome back, Tariq!');
}

function loginAsOwnerDemo() {
  state.user = {
    role: 'owner',
    name: 'PANA Owner',
    phone: '+974 ' + state.settings.fawranNumber
  };
  state.activeTab = 'manage';
  saveState();
  render();
  showToast('Owner Mode Unlocked');
}

function handleRegisterSubmit(e) {
  e.preventDefault();
  const name = document.getElementById('reg-name').value.trim() || 'Doha Baller';
  const phone = document.getElementById('reg-phone').value.trim() || '5500 1122';
  const pos = document.getElementById('reg-pos').value || 'ST';
  if (phone.replace(/\s+/g, '').includes('55128890')) {
    loginAsOwnerDemo();
    return;
  }
  state.user = {
    role: 'player',
    name,
    phone: '+974 ' + phone,
    position: pos,
    ovr: 82,
    goals: 0,
    assists: 0
  };
  state.activeTab = 'games';
  saveState();
  render();
  showToast(`Welcome to PANA SPORT, ${name}!`);
}

function logout() {
  state.user = null;
  state.modal = null;
  saveState();
  render();
}

function toggleLang() {
  state.lang = state.lang === 'en' ? 'ar' : 'en';
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  saveState();
  render();
}

function resetDemoData() {
  localStorage.removeItem(STORAGE_KEY);
  state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  render();
  showToast('Demo data reset to fresh state');
}

// --- PLAYER BOOKING ACTIONS ---
function openBookingModal(matchId) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  state.modal = {
    type: 'book',
    matchId,
    spots: 1,
    teamName: '',
    payMethod: 'Fawran',
    receiptName: ''
  };
  render();
}

function setBookingSpots(n) {
  const m = state.matches.find(x => x.id === state.modal.matchId);
  const avail = Math.max(1, m.capacity - getTakenSpots(m.id));
  state.modal.spots = Math.min(n, avail);
  render();
}

function attachTestReceipt() {
  state.modal.receiptName = `FAWRAN_RECEIPT_${Math.floor(1000 + Math.random() * 9000)}.jpg`;
  render();
  showToast('Test Fawran receipt attached!');
}

function handleFileUpload(input) {
  if (input.files && input.files[0]) {
    state.modal.receiptName = input.files[0].name;
    render();
    showToast('Receipt screenshot attached!');
  }
}

function submitBooking() {
  const m = state.matches.find(x => x.id === state.modal.matchId);
  const avail = m.capacity - getTakenSpots(m.id);
  const spots = state.modal.spots;
  if (spots > avail) {
    showToast('Not enough spots remaining!');
    return;
  }
  if (state.modal.payMethod === 'Fawran' && !state.modal.receiptName) {
    showToast('Please attach your Fawran transfer receipt first');
    return;
  }

  const promoApplied = m.promo6for5 && spots === 6;
  const totalQAR = promoApplied ? m.price * 5 : m.price * spots;
  const bookingId = 'PS-' + Math.floor(8500 + Math.random() * 1400);

  const newBooking = {
    id: bookingId,
    matchId: m.id,
    playerName: state.user.name,
    playerPhone: state.user.phone,
    position: state.user.position || 'CM',
    spots,
    teamName: spots === 6 ? (document.getElementById('team-name-input')?.value.trim() || `${state.user.name.split(' ')[0]}'s Squad`) : '',
    amount: totalQAR,
    method: state.modal.payMethod,
    status: state.modal.payMethod === 'Fawran' ? 'under_review' : 'cash_pending',
    receiptPreview: state.modal.receiptName || '',
    createdAt: 'Just now'
  };

  state.bookings.unshift(newBooking);
  state.notifications.unshift({
    id: 'n' + Date.now(),
    role: 'owner',
    text: state.modal.payMethod === 'Fawran'
      ? `INSTANT ALERT: ${state.user.name} uploaded a ${totalQAR} QAR Fawran receipt for ${m.title}!`
      : `Cash booking (${totalQAR} QAR) by ${state.user.name} for ${m.title}.`,
    time: 'Just now',
    unread: true
  });
  state.notifications.unshift({
    id: 'np' + Date.now(),
    role: 'player',
    text: `Booking ${bookingId} submitted! Owner notified to approve your ${totalQAR} QAR receipt.`,
    time: 'Just now',
    unread: true
  });

  state.modal = null;
  state.activeTab = 'passes';
  saveState();
  render();
  showToast(newBooking.status === 'under_review'
    ? 'Receipt sent! Owner notified for instant approval.'
    : 'Spot reserved! Pay cash at the pitch.');
}

function joinWaitlist(matchId) {
  const exists = state.waitlist.some(w => w.matchId === matchId && w.playerName === state.user.name);
  if (exists) {
    showToast('You are already on the priority waitlist');
    return;
  }
  state.waitlist.push({ matchId, playerName: state.user.name, phone: state.user.phone });
  saveState();
  render();
  showToast('Added to Priority Waitlist! You will be alerted if a spot opens.');
}

function cancelPlayerBooking(bookingId) {
  const b = state.bookings.find(x => x.id === bookingId);
  if (!b) return;
  b.status = 'cancelled';
  state.notifications.unshift({
    id: 'nc' + Date.now(),
    role: 'owner',
    text: `${b.playerName} cancelled booking ${b.id}. Spot reopened.`,
    time: 'Just now',
    unread: true
  });
  saveState();
  render();
  showToast('Booking cancelled & spot released');
}

// --- OWNER ACTIONS ---
function approveBooking(bookingId) {
  const b = state.bookings.find(x => x.id === bookingId);
  if (!b) return;
  b.status = 'confirmed';
  const m = state.matches.find(x => x.id === b.matchId);
  state.notifications.unshift({
    id: 'na' + Date.now(),
    role: 'player',
    text: `APPROVED! Your pass ${b.id} for ${m ? m.title : 'Match'} is confirmed.`,
    time: 'Just now',
    unread: true
  });
  saveState();
  render();
  showToast(`Approved ${b.playerName} (${b.amount} QAR)`);
}

function rejectBooking(bookingId) {
  const b = state.bookings.find(x => x.id === bookingId);
  if (!b) return;
  b.status = 'rejected';
  state.notifications.unshift({
    id: 'nr' + Date.now(),
    role: 'player',
    text: `Receipt for ${b.id} was declined. Please check Fawran transfer & re-upload.`,
    time: 'Just now',
    unread: true
  });
  saveState();
  render();
  showToast(`Declined booking ${b.id}`);
}

function openCreateGameModal() {
  state.modal = { type: 'create_game', price: 45, capacity: 12 };
  render();
}

function createNewGame(e) {
  e.preventDefault();
  const title = document.getElementById('ng-title').value.trim();
  const venue = document.getElementById('ng-venue').value.trim();
  const dateLabel = document.getElementById('ng-date').value;
  const time = document.getElementById('ng-time').value;
  const format = document.getElementById('ng-format').value;
  const price = Number(document.getElementById('ng-price').value) || 45;
  const capacity = Number(document.getElementById('ng-cap').value) || 12;
  const filmed = document.getElementById('ng-filmed').checked;
  const promo6for5 = document.getElementById('ng-promo').checked;
  const allowCash = document.getElementById('ng-cash').checked;

  state.matches.unshift({
    id: 'm' + Date.now(),
    title,
    venue,
    mapUrl: `https://maps.google.com/?q=${encodeURIComponent(venue + ' Doha Qatar')}`,
    dateLabel,
    time,
    duration: 90,
    format,
    price,
    capacity,
    filmed,
    promo6for5,
    allowCash,
    videoUrl: '',
    img: PITCH_IMAGES[state.matches.length % PITCH_IMAGES.length]
  });

  state.modal = null;
  saveState();
  render();
  showToast('New game published to all players!');
}

function cloneGame(matchId) {
  const m = state.matches.find(x => x.id === matchId);
  if (!m) return;
  state.matches.unshift({
    ...m,
    id: 'm' + Date.now(),
    dateLabel: 'Next Week',
    videoUrl: ''
  });
  saveState();
  render();
  showToast(`Cloned "${m.title}" for Next Week`);
}

function saveFawranSettings(e) {
  e.preventDefault();
  state.settings.fawranNumber = document.getElementById('set-fawran').value.trim();
  state.settings.fawranName = document.getElementById('set-fname').value.trim();
  state.settings.whatsappNumber = document.getElementById('set-wa').value.trim();
  saveState();
  render();
  showToast('Fawran & WhatsApp settings updated!');
}

function openVideoModal(matchId) {
  const m = state.matches.find(x => x.id === matchId);
  state.modal = { type: 'edit_video', matchId, videoUrl: m.videoUrl || '' };
  render();
}

function saveMatchVideo(e) {
  e.preventDefault();
  const m = state.matches.find(x => x.id === state.modal.matchId);
  m.videoUrl = document.getElementById('vid-url').value.trim();
  m.filmed = true;
  state.modal = null;
  saveState();
  render();
  showToast('4K Video link shared with match players!');
}

function generateBibsAndWhatsApp(matchId) {
  const m = state.matches.find(x => x.id === matchId);
  const confirmed = state.bookings.filter(b => b.matchId === matchId && (b.status === 'confirmed' || b.status === 'cash_pending'));
  let roster = [];
  confirmed.forEach(b => {
    for (let i = 0; i < b.spots; i++) {
      roster.push(i === 0 ? `${b.playerName} (${b.position})` : `${b.teamName || b.playerName} +${i}`);
    }
  });
  const red = roster.filter((_, idx) => idx % 2 === 0);
  const white = roster.filter((_, idx) => idx % 2 === 1);

  const sheet = `⚽ *PANA SPORT — MATCHDAY LINEUP*\n📍 ${m.title} (${m.venue})\n⏰ ${m.dateLabel} @ ${m.time} (${m.format})\n\n🔴 *RED BIBS (${red.length}):*\n${red.map((p, i) => `${i + 1}. ${p}`).join('\n') || 'Waiting for players'}\n\n⚪ *WHITE BIBS (${white.length}):*\n${white.map((p, i) => `${i + 1}. ${p}`).join('\n') || 'Waiting for players'}\n\n📲 Book spots on PANA SPORT`;

  state.modal = { type: 'squad_sheet', title: m.title, red, white, sheet };
  render();
}

// --- RENDER ENGINE ---
function render() {
  const app = document.getElementById('app');
  if (!state.user) {
    app.innerHTML = renderLoginScreen();
    return;
  }
  if (state.user.role === 'owner') {
    app.innerHTML = renderOwnerApp() + renderModal();
    return;
  }
  app.innerHTML = renderPlayerApp() + renderModal();
}

            <div class="text-[10px] text-red-400 font-bold tracking-widest uppercase mt-0.5">Qatar Football</div>
          </div>

                <option>ST</option><option>RW</option><option>LW</option><option selected>CM</option><option>CB</option><option>GK</option>
              </select>
            </div>
          </div>
          <button type="submit" class="w-full py-3.5 rounded-xl bg-[#B91C2C] text-white font-extrabold text-sm shadow-lg active:scale-98 transition">
            Join PANA SPORT →

        </form>

          <div class="font-black text-sm tracking-tight leading-none">PANA SPORT</div>

function navBtn(tab, icon, label, badge = 0) {
  const active = state.activeTab === tab;
  return `
    <button onclick="state.activeTab='${tab}'; render()" class="relative flex flex-col items-center justify-center py-1 px-3 rounded-xl transition ${active ? 'text-[#B91C2C] bg-red-50' : 'text-gray-400 hover:text-gray-700'}">

      <span class="text-[10px] font-extrabold mt-1">${label}</span>
      ${badge > 0 ? `<span class="absolute top-0.5 right-2 w-4 h-4 rounded-full bg-[#B91C2C] text-white text-[9px] font-black flex items-center justify-center">${badge}</span>` : ''}
    </button>
  `;
}

function renderPlayerGames() {
  const openMatches = state.matches.filter(m => {
    if (m.dateLabel === 'Completed') return false;
    if (state.dateFilter !== 'all' && m.dateLabel !== state.dateFilter) return false;
    if (state.formatFilter !== 'all' && m.format !== state.formatFilter) return false;
    return true;
  });

  const aiPick = state.matches.find(m => m.dateLabel !== 'Completed' && getTakenSpots(m.id) < m.capacity);

  return `
    <div class="p-4 space-y-4">
      <!-- Greeting & AI Matchmaker Banner -->
      <div class="bg-gradient-to-r from-[#111827] to-[#1F2937] text-white rounded-3xl p-4 shadow-lg">
        <div class="flex items-center justify-between mb-2">
          <div>
            <div class="text-[11px] text-gray-400 font-bold">Welcome back,</div>
            <div class="text-base font-black">${state.user.name} <span class="text-xs px-2 py-0.5 rounded-md bg-[#B91C2C] ml-1">${state.user.position}</span></div>
          </div>
          <div class="text-right">
            <div class="text-[10px] text-emerald-400 font-extrabold uppercase">Fawran Ready</div>
            <div class="text-xs font-bold text-gray-300">6 Pay for 5 Active</div>
          </div>
        </div>
        ${aiPick ? `
          <div class="mt-3 pt-3 border-t border-white/10 flex items-center justify-between gap-2">
            <div class="text-xs">
              <span class="text-amber-400 font-black">✨ AI Pick:</span>
              <span class="text-gray-200 font-semibold">${aiPick.title} (${aiPick.time})</span>
            </div>
            <button onclick="openBookingModal('${aiPick.id}')" class="shrink-0 px-3 py-1.5 rounded-xl bg-[#B91C2C] text-white text-[11px] font-extrabold">
              Book
            </button>
          </div>
        ` : ''}
      </div>

      <!-- Date Filter Chips -->
      <div class="flex gap-2 overflow-x-auto no-scrollbar">
        ${['all', 'Tonight', 'Tomorrow', 'This Week'].map(d => `
          <button onclick="state.dateFilter='${d}'; render()" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-extrabold transition ${state.dateFilter === d ? 'bg-[#B91C2C] text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-200'}">
            ${d === 'all' ? 'All Dates' : d}
          </button>
        `).join('')}
      </div>

      <!-- Format Filter Pills -->
      <div class="flex gap-2 overflow-x-auto no-scrollbar">
        ${['all', '6v6', '7v7', '8v8'].map(f => `
          <button onclick="state.formatFilter='${f}'; render()" class="shrink-0 px-3 py-1 rounded-lg text-[11px] font-extrabold transition ${state.formatFilter === f ? 'bg-gray-900 text-white' : 'bg-gray-200/70 text-gray-600'}">
            ${f === 'all' ? 'All Formats' : f}
          </button>
        `).join('')}
      </div>

      <!-- Match Cards -->
      <div class="space-y-4">
        ${openMatches.length === 0 ? `
          <div class="bg-white rounded-3xl p-8 text-center border border-gray-100">
            <div class="text-3xl mb-2">🏟️</div>
            <div class="font-black text-sm">No games match this filter</div>
            <button onclick="state.dateFilter='all'; state.formatFilter='all'; render()" class="mt-3 px-4 py-2 rounded-xl bg-[#B91C2C] text-white text-xs font-bold">Show All Games</button>
          </div>
        ` : openMatches.map(m => renderMatchCard(m)).join('')}
      </div>
    </div>
  `;
}

function renderMatchCard(m) {
  const taken = getTakenSpots(m.id);
  const left = Math.max(0, m.capacity - taken);
  const pct = Math.min(100, Math.round((taken / m.capacity) * 100));
  const isFull = left === 0;

  return `
    <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100">
      <div class="relative h-40">
        <img src="${m.img}" class="w-full h-full object-cover" alt="${m.title}">
        <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/25 to-transparent"></div>
        <div class="absolute top-3 left-3 flex gap-1.5">
          <span class="px-2.5 py-1 rounded-lg bg-black/75 text-white text-[10px] font-black">${m.format}</span>
          ${m.filmed ? `<span class="px-2.5 py-1 rounded-lg bg-[#B91C2C] text-white text-[10px] font-black">🎥 4K FILMED</span>` : ''}
          ${m.promo6for5 ? `<span class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white text-[10px] font-black">6 PAY FOR 5</span>` : ''}
        </div>
        <div class="absolute top-3 right-3 px-2.5 py-1 rounded-xl bg-white text-gray-900 font-black text-xs shadow">
          ${m.price} QAR
        </div>
        <div class="absolute bottom-3 left-3.5 right-3.5 text-white">
          <div class="font-black text-base leading-tight">${m.title}</div>
          <div class="text-[11px] text-gray-200 font-medium mt-0.5">📍 ${m.venue} • ${m.dateLabel} ${m.time}</div>
        </div>
      </div>

      <div class="p-4">
        <div class="flex items-center justify-between text-xs font-bold mb-1.5">
          <span class="${isFull ? 'text-red-600' : left <= 3 ? 'text-amber-600' : 'text-emerald-600'}">
            ${isFull ? '🔴 Fully Booked' : left <= 3 ? `🔥 Almost Full (${left} left)` : `🟢 ${left} Spots Available`}
          </span>
          <span class="text-gray-500">${taken}/${m.capacity} Players</span>
        </div>
        <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden mb-3.5">
          <div class="h-full ${isFull ? 'bg-red-600' : 'bg-[#B91C2C]'} rounded-full" style="width:${pct}%"></div>
        </div>

        <div class="flex gap-2">
          <a href="${m.mapUrl}" target="_blank" class="px-3.5 py-2.5 rounded-xl bg-gray-100 text-gray-700 text-xs font-extrabold flex items-center justify-center">
            📍 Map
          </a>
          ${isFull ? `
            <button onclick="joinWaitlist('${m.id}')" class="flex-1 py-2.5 rounded-xl bg-gray-900 text-white text-xs font-extrabold">
              Join Waitlist
            </button>
          ` : `
            <button onclick="openBookingModal('${m.id}')" class="flex-1 py-2.5 rounded-xl bg-[#B91C2C] text-white text-xs font-extrabold shadow-sm active:scale-98 transition">
              Book Spot (${m.price} QAR) →
            </button>
          `}
        </div>
      </div>
    </div>
  `;
}

function renderPlayerPasses() {
  const myBookings = state.bookings.filter(b => b.playerName === state.user.name);
  return `
    <div class="p-4 space-y-4">
      <div class="flex items-center justify-between">

      ` : myBookings.map(b => {

            <div class="bg-gray-50 rounded-2xl p-3 flex items-center justify-between text-xs">
              <div>
                <div class="text-gray-400 font-bold">Spots Reserved</div>

              </div>
              <div class="text-right">
                <div class="text-gray-400 font-bold">${b.method}</div>
                <div class="font-black text-[#B91C2C]">${b.amount} QAR</div>
              </div>
            </div>

            ${m.videoUrl && b.status === 'confirmed' ? `
              <a href="${m.videoUrl}" target="_blank" class="block w-full py-2.5 rounded-xl bg-gray-900 text-white text-center text-xs font-extrabold">
                🎥 Watch 4K Match Recording
              </a>
            ` : ''}

            ${(b.status === 'under_review' || b.status === 'cash_pending') ? `
              <button onclick="cancelPlayerBooking('${b.id}')" class="w-full py-2 rounded-xl border border-gray-200 text-gray-500 text-xs font-bold">
                Cancel Booking
              </button>
            ` : ''}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderOwnerManage() {
  const pending = state.bookings.filter(b => b.status === 'under_review');
  const confirmedRev = state.bookings.filter(b => b.status === 'confirmed').reduce((s, b) => s + Number(b.amount), 0);
  const cashPending = state.bookings.filter(b => b.status === 'cash_pending').reduce((s, b) => s + Number(b.amount), 0);

  return `
    <div class="p-4 space-y-4">
      <!-- Revenue Summary Cards -->
      <div class="grid grid-cols-3 gap-2.5">
        <div class="bg-white p-3 rounded-2xl border border-gray-100 shadow-sm">
          <div class="text-[10px] font-bold text-gray-400 uppercase">Collected</div>
          <div class="text-base font-black text-emerald-600 mt-0.5">${confirmedRev} QAR</div>
        </div>
        <div class="bg-white p-3 rounded-2xl border border-gray-100 shadow-sm">

          <div class="text-base font-black text-[#B91C2C] mt-0.5">${pending.length}</div>

      </div>

      <!-- Instant Fawran Receipt Queue -->
      <div>
        <div class="flex items-center justify-between mb-2.5">
          <h2 class="font-black text-base">Fawran Receipts (${pending.length})</h2>
          <span class="text-[11px] font-bold text-gray-400">Check balance & approve</span>
        </div>

        ${pending.length === 0 ? `
          <div class="bg-white rounded-3xl p-6 text-center border border-gray-100">
            <div class="text-2xl mb-1">✅</div>
            <div class="font-extrabold text-sm">All receipts reviewed!</div>
            <div class="text-xs text-gray-400 mt-0.5">New player Fawran uploads will appear here instantly.</div>
          </div>
        ` : pending.map(b => {
          const m = state.matches.find(x => x.id === b.matchId) || {};
          return `
            <div class="bg-white rounded-3xl p-4 shadow-sm border-2 border-amber-300 space-y-3 mb-3">
              <div class="flex items-center justify-between">
                <span class="px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 text-[10px] font-black">NEW RECEIPT • ${b.createdAt}</span>
                <span class="font-black text-base text-[#B91C2C]">+${b.amount} QAR</span>
              </div>
              <div>
                <div class="font-black text-sm">${b.playerName} (${b.spots} Spot${b.spots > 1 ? 's' : ''})</div>
                <div class="text-xs text-gray-500 font-semibold">${b.playerPhone} • ${m.title || 'Game'}</div>

        <div class="space-y-2">
          ${state.bookings.map(b => {
            const m = state.matches.find(x => x.id === b.matchId) || {};

                <div class="text-right">

                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

                🎥 Video Link
              </button>
              <button onclick="cloneGame('${m.id}')" class="py-2 rounded-xl bg-gray-100 text-gray-700 text-[11px] font-extrabold">
                📋 Clone
              </button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderOwnerPlayers() {
  return `
    <div class="p-4 space-y-4">
      <h2 class="font-black text-lg">Match Lineups & Cash</h2>
      ${state.matches.filter(m => m.dateLabel !== 'Completed').map(m => {
        const list = state.bookings.filter(b => b.matchId === m.id && b.status !== 'rejected' && b.status !== 'cancelled');
        return `
          <div class="bg-white rounded-3xl p-4 border border-gray-100 shadow-sm space-y-3">
            <div class="flex items-center justify-between">
              <div class="font-black text-sm">${m.title}</div>
              <button onclick="generateBibsAndWhatsApp('${m.id}')" class="px-3 py-1.5 rounded-xl bg-[#B91C2C] text-white text-[11px] font-extrabold">
                Auto-Split Bibs
              </button>
            </div>
            ${list.length === 0 ? `<div class="text-xs text-gray-400">No players registered yet.</div>` : list.map(b => `
              <div class="flex items-center justify-between py-2 border-t border-gray-100 text-xs">
                <div>
                  <span class="font-extrabold">${b.playerName}</span>
                  <span class="text-gray-400">(${b.spots}x • ${b.method})</span>
                </div>
                ${b.status === 'cash_pending' ? `
                  <button onclick="approveBooking('${b.id}')" class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white text-[10px] font-extrabold">
                    Collect ${b.amount} QAR
                  </button>
                ` : `<span class="text-[10px] font-black uppercase ${b.status === 'confirmed' ? 'text-emerald-600' : 'text-amber-600'}">${b.status.replace('_', ' ')}</span>`}
              </div>
            `).join('')}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderOwnerSettings() {
  return `
    <div class="p-4 space-y-4">
      <h2 class="font-black text-lg">Fawran & Payment Setup</h2>
      <form onsubmit="saveFawranSettings(event)" class="bg-white rounded-3xl p-5 border border-gray-100 shadow-sm space-y-3.5">
        <div>
          <label class="text-[11px] font-bold text-gray-500 uppercase">Your Fawran Mobile Number</label>
          <input id="set-fawran" type="text" value="${state.settings.fawranNumber}" class="w-full mt-1 px-3.5 py-2.5 rounded-xl bg-gray-100 text-sm font-black" />
        </div>
        <div>
          <label class="text-[11px] font-bold text-gray-500 uppercase">Fawran Account Name</label>
          <input id="set-fname" type="text" value="${state.settings.fawranName}" class="w-full mt-1 px-3.5 py-2.5 rounded-xl bg-gray-100 text-sm font-bold" />
        </div>
        <div>
          <label class="text-[11px] font-bold text-gray-500 uppercase">WhatsApp Support Number</label>
          <input id="set-wa" type="text" value="${state.settings.whatsappNumber}" class="w-full mt-1 px-3.5 py-2.5 rounded-xl bg-gray-100 text-sm font-bold" />
        </div>
        <button type="submit" class="w-full py-3.5 rounded-xl bg-[#B91C2C] text-white font-extrabold text-sm">
          Save Fawran Details
        </button>
      </form>
    </div>
  `;
}

function renderAlerts(role) {
  const list = state.notifications.filter(n => n.role === role);
  list.forEach(n => n.unread = false);
  saveState();
  return `
    <div class="p-4 space-y-3">
      <h2 class="font-black text-lg">Notifications</h2>
      ${list.map(n => `
        <div class="bg-white rounded-2xl p-3.5 border border-gray-100 shadow-sm text-xs">
          <div class="font-bold text-gray-900">${n.text}</div>
          <div class="text-[10px] text-gray-400 font-bold mt-1">${n.time}</div>
        </div>
      `).join('')}
    </div>
  `;
}

// ================= MODALS =================
function renderModal() {
  if (!state.modal) return '';

  if (state.modal.type === 'book') {
    const m = state.matches.find(x => x.id === state.modal.matchId);
    const avail = Math.max(1, m.capacity - getTakenSpots(m.id));
    const spots = state.modal.spots;
    const isPromo = m.promo6for5 && spots === 6;
    const total = isPromo ? m.price * 5 : m.price * spots;
    const waText = encodeURIComponent(`Salam PANA SPORT! I booked ${spots} spot(s) for ${m.title} (${total} QAR via Fawran). Player: ${state.user.name}`);

    return `
      <div class="fixed inset-0 z-50 bg-black/70 flex items-end justify-center" onclick="if(event.target===this){state.modal=null;render();}">
        <div class="w-full max-w-[430px] bg-white rounded-t-3xl p-5 animate-sheet max-h-[92vh] overflow-y-auto space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <div class="text-[10px] font-black text-[#B91C2C] uppercase">Instant Booking</div>
              <div class="font-black text-base">${m.title}</div>
            </div>
            <button onclick="state.modal=null; render()" class="w-8 h-8 rounded-full bg-gray-100 font-black text-sm">✕</button>
          </div>

          <!-- Step 1: Spots / Team -->
          <div>
            <div class="text-xs font-extrabold text-gray-600 mb-2">1. Select Spots (${avail} left)</div>
            <div class="grid grid-cols-3 gap-2">
              <button onclick="setBookingSpots(1)" class="py-2.5 rounded-xl border text-xs font-extrabold ${spots === 1 ? 'border-[#B91C2C] bg-red-50 text-[#B91C2C]' : 'border-gray-200'}">
                Solo (1)
              </button>
              <button onclick="setBookingSpots(2)" ${avail < 2 ? 'disabled' : ''} class="py-2.5 rounded-xl border text-xs font-extrabold ${spots > 1 && spots < 6 ? 'border-[#B91C2C] bg-red-50 text-[#B91C2C]' : 'border-gray-200 disabled:opacity-40'}">
                Duo (2)
              </button>
              <button onclick="setBookingSpots(6)" ${avail < 6 ? 'disabled' : ''} class="py-2.5 rounded-xl border text-xs font-extrabold ${spots === 6 ? 'border-emerald-600 bg-emerald-50 text-emerald-700' : 'border-gray-200 disabled:opacity-40'}">
                6 Squad (Pay 5!)
              </button>
            </div>
            ${spots === 6 ? `
              <input id="team-name-input" type="text" placeholder="Enter Squad Name (e.g. Doha Kings)" class="w-full mt-2.5 px-3.5 py-2.5 rounded-xl bg-gray-100 text-xs font-bold" />
            ` : ''}
          </div>

          <!-- Step 2: Payment Method -->
          <div>
            <div class="text-xs font-extrabold text-gray-600 mb-2">2. Payment Method</div>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="state.modal.payMethod='Fawran'; render()" class="py-2.5 rounded-xl border text-xs font-extrabold ${state.modal.payMethod === 'Fawran' ? 'border-[#B91C2C] bg-red-50 text-[#B91C2C]' : 'border-gray-200'}">
                ⚡ Fawran Transfer
              </button>
              ${m.allowCash ? `
                <button onclick="state.modal.payMethod='Cash'; render()" class="py-2.5 rounded-xl border text-xs font-extrabold ${state.modal.payMethod === 'Cash' ? 'border-gray-900 bg-gray-900 text-white' : 'border-gray-200'}">
                  💵 Cash at Pitch
                </button>
              ` : ''}
            </div>
          </div>

          <!-- Fawran Box -->
          ${state.modal.payMethod === 'Fawran' ? `
            <div class="bg-gray-900 text-white rounded-2xl p-4 space-y-3">
              <div class="flex items-center justify-between">
                <div>
                  <div class="text-[10px] text-gray-400 font-bold uppercase">Send Fawran To</div>
                  <div class="text-lg font-black tracking-wide">${state.settings.fawranNumber}</div>
                  <div class="text-[11px] text-emerald-400 font-bold">${state.settings.fawranName}</div>
                </div>
                <button onclick="copyText('${state.settings.fawranNumber}', 'Fawran Number')" class="px-3 py-2 rounded-xl bg-white/15 text-xs font-extrabold">
                  Copy #
                </button>
              </div>

              <div class="pt-2.5 border-t border-white/10 space-y-2">
                <div class="text-[11px] font-bold text-gray-300">Attach Fawran Receipt Screenshot:</div>
                ${state.modal.receiptName ? `
                  <div class="px-3 py-2 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs font-extrabold flex justify-between items-center">
                    <span>✅ ${state.modal.receiptName}</span>
                    <button onclick="state.modal.receiptName=''; render()" class="text-white underline text-[10px]">Change</button>
                  </div>
                ` : `
                  <div class="grid grid-cols-2 gap-2">
                    <label class="py-2.5 px-3 rounded-xl bg-white text-gray-900 text-center text-xs font-extrabold cursor-pointer">
                      📷 Upload Photo
                      <input type="file" accept="image/*" onchange="handleFileUpload(this)" class="hidden" />
                    </label>
                    <button type="button" onclick="attachTestReceipt()" class="py-2.5 px-3 rounded-xl bg-[#B91C2C] text-white text-xs font-extrabold">
                      ⚡ Test Receipt
                    </button>
                  </div>
                `}
              </div>
            </div>
          ` : ''}

          <!-- Price Summary & Submit -->
          <div class="bg-gray-50 rounded-2xl p-3.5 flex items-center justify-between">
            <div>
              <div class="text-[11px] font-bold text-gray-500">Total Amount Due</div>
              ${isPromo ? `<div class="text-[10px] font-black text-emerald-600">🎉 6 Players Pay for 5 Applied (-${m.price} QAR)</div>` : ''}
            </div>
            <div class="text-xl font-black text-gray-900">${total} QAR</div>
          </div>

          <button onclick="submitBooking()" class="w-full py-3.5 rounded-2xl bg-[#B91C2C] text-white font-extrabold text-sm shadow-lg">
            ${state.modal.payMethod === 'Fawran' ? 'Submit Receipt & Book →' : 'Confirm Cash Spot →'}
          </button>

          <a href="https://wa.me/${state.settings.whatsappNumber}?text=${waText}" target="_blank" class="block text-center text-xs font-extrabold text-emerald-700">
            💬 Need help? Message Owner on WhatsApp
          </a>
        </div>
      </div>
    `;
  }

  if (state.modal.type === 'create_game') {
    return `
      <div class="fixed inset-0 z-50 bg-black/70 flex items-end justify-center" onclick="if(event.target===this){state.modal=null;render();}">
        <form onsubmit="createNewGame(event)" class="w-full max-w-[430px] bg-white rounded-t-3xl p-5 animate-sheet max-h-[92vh] overflow-y-auto space-y-3">
          <div class="flex items-center justify-between">
            <div class="font-black text-base">Create New Game</div>
            <button type="button" onclick="state.modal=null; render()" class="w-8 h-8 rounded-full bg-gray-100 font-black text-sm">✕</button>
          </div>

          <div>
            <label class="text-[11px] font-bold text-gray-500 uppercase">Game Title</label>
            <input id="ng-title" required value="Doha Floodlit 6v6" class="w-full mt-1 px-3.5 py-2.5 rounded-xl bg-gray-100 text-xs font-bold" />
          </div>
          <div>
            <label class="text-[11px] font-bold text-gray-500 uppercase">Pitch / Venue</label>
            <input id="ng-venue" required value="Al Waab Arena • Pitch 2" class="w-full mt-1 px-3.5 py-2.5 rounded-xl bg-gray-100 text-xs font-bold" />
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="text-[11px] font-bold text-gray-500 uppercase">Day</label>
              <select id="ng-date" class="w-full mt-1 px-2.5 py-2.5 rounded-xl bg-gray-100 text-xs font-bold">
                <option>Tonight</option><option>Tomorrow</option><option>This Week</option>
              </select>
            </div>
            <div>
              <label class="text-[11px] font-bold text-gray-500 uppercase">Time</label>
              <input id="ng-time" type="time" value="21:00" class="w-full mt-1 px-2.5 py-2.5 rounded-xl bg-gray-100 text-xs font-bold" />
            </div>
            <div>
              <label class="text-[11px] font-bold text-gray-500 uppercase">Format</label>
              <select id="ng-format" class="w-full mt-1 px-2.5 py-2.5 rounded-xl bg-gray-100 text-xs font-bold">
                <option>6v6</option><option>7v7</option><option>8v8</option><option>9v9</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[11px] font-bold text-gray-500 uppercase">Price / Player (QAR)</label>
              <input id="ng-price" type="number" value="45" oninput="document.getElementById('rev-est').textContent = (this.value * document.getElementById('ng-cap').value) + ' QAR'" class="w-full mt-1 px-3.5 py-2.5 rounded-xl bg-gray-100 text-xs font-black" />
            </div>
            <div>
              <label class="text-[11px] font-bold text-gray-500 uppercase">Total Spots</label>
              <input id="ng-cap" type="number" value="12" oninput="document.getElementById('rev-est').textContent = (this.value * document.getElementById('ng-price').value) + ' QAR'" class="w-full mt-1 px-3.5 py-2.5 rounded-xl bg-gray-100 text-xs font-black" />
            </div>
          </div>

          <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-3 flex justify-between items-center text-xs">
            <span class="font-bold text-emerald-900">Full Game Revenue:</span>
            <span id="rev-est" class="font-black text-emerald-700 text-sm">540 QAR</span>
          </div>

          <div class="flex flex-wrap gap-3 text-xs font-bold pt-1">
            <label class="flex items-center gap-1.5"><input id="ng-promo" type="checkbox" checked /> 6 Pay for 5</label>
            <label class="flex items-center gap-1.5"><input id="ng-cash" type="checkbox" checked /> Allow Cash</label>
            <label class="flex items-center gap-1.5"><input id="ng-filmed" type="checkbox" checked /> 4K Filmed</label>
          </div>

          <button type="submit" class="w-full py-3.5 rounded-2xl bg-[#B91C2C] text-white font-extrabold text-sm shadow-lg">
            Publish Game Now →
          </button>
        </form>
      </div>
    `;
  }

  if (state.modal.type === 'edit_video') {
    return `
      <div class="fixed inset-0 z-50 bg-black/70 flex items-end justify-center" onclick="if(event.target===this){state.modal=null;render();}">
        <form onsubmit="saveMatchVideo(event)" class="w-full max-w-[430px] bg-white rounded-t-3xl p-5 animate-sheet space-y-3">
          <div class="font-black text-base">🎥 Attach 4K Match Video Link</div>
          <input id="vid-url" type="url" required placeholder="https://youtube.com/..." value="${state.modal.videoUrl}" class="w-full px-3.5 py-3 rounded-xl bg-gray-100 text-xs font-bold" />
          <button type="submit" class="w-full py-3 rounded-xl bg-[#B91C2C] text-white font-extrabold text-xs">Save & Notify Players</button>
        </form>
      </div>
    `;
  }

  if (state.modal.type === 'squad_sheet') {
    return `
      <div class="fixed inset-0 z-50 bg-black/70 flex items-end justify-center" onclick="if(event.target===this){state.modal=null;render();}">
        <div class="w-full max-w-[430px] bg-white rounded-t-3xl p-5 animate-sheet space-y-3">
          <div class="flex items-center justify-between">
            <div class="font-black text-base">👕 Red vs White Bibs</div>
            <button onclick="state.modal=null; render()" class="w-8 h-8 rounded-full bg-gray-100 font-black text-sm">✕</button>
          </div>
          <pre class="bg-gray-100 rounded-2xl p-3 text-[11px] font-mono whitespace-pre-wrap max-h-60 overflow-y-auto">${state.modal.sheet}</pre>
          <button onclick="copyText(state.modal.sheet, 'WhatsApp Lineup')" class="w-full py-3.5 rounded-xl bg-emerald-600 text-white font-extrabold text-xs">
            📋 Copy Lineup for WhatsApp
          </button>
        </div>
      </div>
    `;
  }

  return '';
}

render();
</script>
</body>
</html>
