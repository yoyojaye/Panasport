<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#8A1538" />
  <title>PANA SPORT — Doha Pickup Football</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0F172A; margin: 0; padding: 0; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0.6; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-sheet { animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1); }
    .animate-fade { animation: fadeIn 0.22s ease-out; }
  </style>
</head>
<body class="flex justify-center min-h-screen bg-slate-950">

<div id="app" class="w-full max-w-[430px] min-h-screen bg-[#F7F7F9] text-slate-900 relative overflow-x-hidden shadow-2xl flex flex-col"></div>

<script>
// ==========================================
// 1. MANAGER EMAIL CONFIGURATION
// ==========================================
const OWNER_EMAIL = "creatbrook@gmail.com";

// ==========================================
// 2. AUTHENTICATED PITCH & PLAYER PHOTOGRAPHY
// ==========================================
const PHOTOS = {
  splashHero: "https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=900&q=85",
  promoBanner: "https://images.unsplash.com/photo-1518605368461-1ee7e33f28c4?auto=format&fit=crop&w=900&q=85",
  pitchNight1: "https://images.unsplash.com/photo-1529900748604-07564a03e7a6?auto=format&fit=crop&w=900&q=85",
  pitchNight2: "https://images.unsplash.com/photo-1459865264687-595d652de67e?auto=format&fit=crop&w=900&q=85",
  pitchNight3: "https://images.unsplash.com/photo-1551958219-acbc608c6377?auto=format&fit=crop&w=900&q=85",
  defaultAvatar: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=400&q=85"
};

// ==========================================
// 3. INITIAL APP DATA (QATAR PICKUP FOCUS)
// ==========================================
const DEFAULT_DATA = {
  organizer: {
    name: "PANA SPORT QATAR",
    fawranAlias: "PANASPORT",
    fawranNumber: "+974 5512 8890",
    bankName: "QNB (Fawran Instant)"
  },
  matches: [
    {
      id: "m1",
      title: "8v8 FLOODLIT PICKUP",
      venue: "Al Sadd Sports Complex, Doha",
      area: "Al Sadd",
      dateLabel: "Tonight • 20:30",
      duration: "90 min",
      priceQAR: 35,
      spotsTotal: 16,
      spotsTaken: 13,
      recorded: true,
      level: "Competitive",
      image: PHOTOS.pitchNight1,
      players: [
        { name: "Tariq Al-Mannai", pos: "MID", rating: 88, status: "Confirmed", bib: "Red" },
        { name: "Yousef K.", pos: "FWD", rating: 86, status: "Confirmed", bib: "White" },
        { name: "Hamad Al-Thani", pos: "DEF", rating: 85, status: "Confirmed", bib: "Red" },
        { name: "Omar N.", pos: "GK", rating: 89, status: "Confirmed", bib: "White" },
        { name: "Khalid M.", pos: "MID", rating: 82, status: "Confirmed", bib: "Red" },
        { name: "Faisal R.", pos: "DEF", rating: 80, status: "Confirmed", bib: "White" }
      ],
      waitlist: ["Bader S."]
    },
    {
      id: "m2",
      title: "7v7 OPEN TURF NIGHT",
      venue: "Aspire Zone Pitch 4, Al Waab",
      area: "Al Waab",
      dateLabel: "Tomorrow • 19:00",
      duration: "60 min",
      priceQAR: 30,
      spotsTotal: 14,
      spotsTaken: 10,
      recorded: true,
      level: "All Levels",
      image: PHOTOS.pitchNight2,
      players: [
        { name: "Nasser A.", pos: "FWD", rating: 87, status: "Confirmed", bib: "Red" },
        { name: "Sami H.", pos: "MID", rating: 84, status: "Confirmed", bib: "White" }
      ],
      waitlist: []
    },
    {
      id: "m3",
      title: "9v9 LUSAIL STADIUM TURF",
      venue: "Lusail Marina Fields, Doha",
      area: "Lusail",
      dateLabel: "Sun, 15 Nov • 21:00",
      duration: "90 min",
      priceQAR: 40,
      spotsTotal: 18,
      spotsTaken: 18,
      recorded: false,
      level: "High Tempo",
      image: PHOTOS.pitchNight3,
      players: [
        { name: "Rashid K.", pos: "DEF", rating: 88, status: "Confirmed", bib: "Red" }
      ],
      waitlist: ["Zaid M.", "Ali H."]
    }
  ],
  bookings: [
    {
      id: "BK-9041",
      matchId: "m1",
      matchTitle: "8v8 FLOODLIT PICKUP",
      playerName: "Jassim Al-Kuwari",
      phone: "+974 6641 2209",
      groupSize: 1,
      totalQAR: 35,
      method: "Fawran Transfer",
      status: "Pending Verification",
      timestamp: "4 mins ago",
      receiptAttached: true
    }
  ]
};

// ==========================================
// 4. STATE MANAGEMENT & ROLE DETECTION
// ==========================================
let state = {
  screen: "splash", // splash | auth | otp | app | owner
  authMode: "phone", // phone | email
  authInput: "",
  isOwnerSession: false,
  otpDigits: ["7", "4", "9", "2"],
  activeTab: "home", // home | stats | squad
  bookingSheetMatch: null,
  groupSize: 1,
  payMethod: "fawran",
  receiptUploaded: false,
  receiptFileName: "",
  showAccountMenu: false,
  showEditProfile: false,
  toast: null,
  user: {
    name: "Tariq Al-Kuwari",
    phone: "+974 5589 4321",
    email: "",
    position: "Midfielder",
    age: 26,
    nationality: "Qatar",
    flag: "🇶🇦",
    debut: "NOV, 2026",
    avatar: PHOTOS.defaultAvatar,
    walletQAR: 70.00,
    stats: {
      played: 14,
      won: 9,
      lost: 5,
      motm: 3,
      goals: 11
    }
  },
  data: JSON.parse(localStorage.getItem("panasport_v3_data")) || DEFAULT_DATA
};

function saveData() {
  localStorage.setItem("panasport_v3_data", JSON.stringify(state.data));
}

function showToast(msg) {
  state.toast = msg;
  render();
  setTimeout(() => {
    state.toast = null;
    render();
  }, 2800);
}

function isManagerEmail(email) {
  const clean = (email || "").trim().toLowerCase();
  const target = (OWNER_EMAIL || "").trim().toLowerCase();
  return clean.length > 0 && clean === target;
}

// ==========================================
// 5. ACTIONS
// ==========================================
function goScreen(s) {
  state.screen = s;
  window.scrollTo(0, 0);
  render();
}

function handleAuthContinue() {
  const val = state.authInput.trim();
  if (!val) {
    showToast(state.authMode === "phone" ? "Please enter your Qatar phone number" : "Please enter your email address");
    return;
  }

  if (state.authMode === "phone") {
    state.user.phone = "+974 " + val.replace(/^\+974\s*/, "");
    state.isOwnerSession = false;
  } else {
    state.user.email = val;
    state.isOwnerSession = isManagerEmail(val);
    if (!state.isOwnerSession) {
      const prefix = val.split("@")[0];
      state.user.name = prefix.charAt(0).toUpperCase() + prefix.slice(1);
    }
  }
  goScreen("otp");
}

function verifyOtpAndEnter() {
  if (state.isOwnerSession) {
    goScreen("owner");
    showToast("Manager Verified — Welcome to PANA SPORT Admin!");
  } else {
    goScreen("app");
    showToast("Welcome to PANA SPORT Doha!");
  }
}

function openBooking(matchId) {
  const m = state.data.matches.find(x => x.id === matchId);
  if (!m) return;
  state.bookingSheetMatch = m;
  state.groupSize = 1;
  state.payMethod = "fawran";
  state.receiptUploaded = false;
  state.receiptFileName = "";
  render();
}

function setGroupSize(sz) {
  state.groupSize = sz;
  render();
}

function calcTotal(price, size) {
  const payable = size === 6 ? 5 : size;
  return payable * price;
}

function handleReceiptPick(e) {
  const file = e.target.files[0];
  if (file) {
    state.receiptUploaded = true;
    state.receiptFileName = file.name;
    render();
  }
}

function handleAvatarPick(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    state.user.avatar = ev.target.result;
    render();
    showToast("Player photo updated!");
  };
  reader.readAsDataURL(file);
}

function submitBooking() {
  const m = state.bookingSheetMatch;
  if (!m) return;
  const isFull = m.spotsTaken >= m.spotsTotal;
  if (isFull) {
    m.waitlist.push(state.user.name);
    saveData();
    state.bookingSheetMatch = null;
    showToast("Added to priority waitlist!");
    return;
  }
  if (state.payMethod === "fawran" && !state.receiptUploaded) {
    showToast("Please upload your Fawran receipt screenshot first");
    return;
  }

  const total = calcTotal(m.priceQAR, state.groupSize);
  const newBk = {
    id: "BK-" + Math.floor(1000 + Math.random() * 9000),
    matchId: m.id,
    matchTitle: m.title,
    playerName: state.user.name + (state.groupSize > 1 ? ` (+${state.groupSize - 1} Friends)` : ""),
    phone: state.user.phone,
    groupSize: state.groupSize,
    totalQAR: total,
    method: state.payMethod === "fawran" ? "Fawran Transfer" : "Cash at Pitch",
    status: state.payMethod === "fawran" ? "Pending Verification" : "Confirmed (Cash)",
    timestamp: "Just now",
    receiptAttached: state.receiptUploaded
  };

  state.data.bookings.unshift(newBk);
  m.spotsTaken = Math.min(m.spotsTotal, m.spotsTaken + state.groupSize);
  m.players.push({
    name: state.user.name,
    pos: state.user.position.slice(0, 3).toUpperCase(),
    rating: 86,
    status: newBk.status,
    bib: m.players.length % 2 === 0 ? "Red" : "White"
  });

  saveData();
  state.bookingSheetMatch = null;
  showToast(state.payMethod === "fawran" ? "Receipt sent to organizer!" : "Spot reserved! Pay cash at pitch.");
}

function approveBooking(id) {
  const bk = state.data.bookings.find(b => b.id === id);
  if (bk) {
    bk.status = "Approved & Paid";
    saveData();
    showToast(`Approved ${bk.playerName}`);
  }
}

function rejectBooking(id) {
  const idx = state.data.bookings.findIndex(b => b.id === id);
  if (idx > -1) {
    const bk = state.data.bookings[idx];
    const m = state.data.matches.find(x => x.id === bk.matchId);
    if (m) m.spotsTaken = Math.max(0, m.spotsTaken - bk.groupSize);
    state.data.bookings.splice(idx, 1);
    saveData();
    showToast("Booking declined & spot reopened");
  }
}

function autoBalanceBibs(matchId) {
  const m = state.data.matches.find(x => x.id === matchId);
  if (!m) return;
  const sorted = [...m.players].sort((a, b) => b.rating - a.rating);
  sorted.forEach((p, idx) => {
    p.bib = (idx % 4 === 0 || idx % 4 === 3) ? "Red" : "White";
  });
  m.players = sorted;
  saveData();
  showToast("Teams balanced by rating (Red vs White)!");
}

function generateWhatsAppLineup(matchId) {
  const m = state.data.matches.find(x => x.id === matchId) || state.data.matches[0];
  const reds = m.players.filter(p => p.bib === "Red").map((p, i) => `${i + 1}. ${p.name}`).join("\n") || "1. Open Spot";
  const whites = m.players.filter(p => p.bib === "White").map((p, i) => `${i + 1}. ${p.name}`).join("\n") || "1. Open Spot";
  return `⚽ *PANA SPORT QATAR — MATCH LINEUP*\n🏟️ *${m.title}*\n📍 ${m.venue}\n🕒 ${m.dateLabel} | 💰 ${m.priceQAR} QAR\n\n🔴 *TEAM MAROON / RED*\n${reds}\n\n⚪ *TEAM WHITE*\n${whites}\n\n📲 Book remaining spots: https://yoyojaye.github.io/Panasport/`;
}

function copyWhatsAppText(matchId) {
  const txt = generateWhatsAppLineup(matchId);
  navigator.clipboard?.writeText(txt);
  showToast("WhatsApp lineup copied to clipboard!");
}

function saveProfileChanges(e) {
  e.preventDefault();
  const form = e.target;
  state.user.name = form.fullname.value.trim() || state.user.name;
  state.user.position = form.position.value;
  state.user.age = parseInt(form.age.value) || 25;
  state.user.nationality = form.nationality.value;
  const flags = { "Qatar": "🇶🇦", "Egypt": "🇪🇬", "Jordan": "🇯🇴", "Morocco": "🇲🇦", "Ethiopia": "🇪🇹", "India": "🇮🇳", "UK": "🇬🇧", "Brazil": "🇧🇷" };
  state.user.flag = flags[state.user.nationality] || "🇶🇦";
  state.showEditProfile = false;
  showToast("Player card saved!");
}

// ==========================================
// 6. VIEWS
// ==========================================
function renderSplash() {
  return `
    <div class="relative min-h-screen w-full flex flex-col justify-between overflow-hidden bg-slate-950 text-white">
      <img src="${PHOTOS.splashHero}" alt="Doha Night Football" class="absolute inset-0 w-full h-full object-cover object-center scale-105 brightness-90" />
      <div class="absolute inset-0 bg-gradient-to-t from-black via-black/55 to-black/20"></div>

      <!-- Top Brand Pill -->
      <div class="relative z-10 flex items-center justify-between px-6 pt-12">
        <div class="flex items-center gap-2.5 bg-black/40 backdrop-blur-md border border-white/15 px-3.5 py-2 rounded-full">
          <div class="w-7 h-7 rounded-full bg-[#8A1538] flex items-center justify-center font-extrabold text-xs tracking-tighter text-white shadow">PS</div>
          <span class="text-xs font-extrabold tracking-widest uppercase">PANA SPORT</span>
        </div>
      </div>

      <!-- Bottom Hero Copy & Continue CTA -->
      <div class="relative z-10 px-6 pb-10 pt-20 animate-fade">
        <div class="inline-flex items-center gap-2 bg-[#8A1538] text-white text-[11px] font-extrabold uppercase tracking-widest px-3 py-1 rounded-md mb-4 shadow-lg">
          <span>🇶🇦 DOHA PICKUP FOOTBALL</span>
        </div>

        <h1 class="text-[34px] leading-[1.06] font-extrabold tracking-tight uppercase mb-3 drop-shadow">
          SHOW UP, PLAY,<br/>AND LET US<br/>HANDLE THE<br/>DETAILS
        </h1>

        <p class="text-sm text-slate-200/90 font-medium mb-7 max-w-[320px]">
          Instant pickup match slots, verified Fawran payments, and balanced Doha squads.
        </p>

        <button onclick="goScreen('auth')" class="w-full py-4 rounded-2xl bg-[#8A1538] hover:bg-[#70102D] active:scale-[0.99] transition text-white font-extrabold text-base tracking-wide shadow-xl shadow-[#8A1538]/40">
          Continue
        </button>
      </div>
    </div>
  `;
}

function renderAuth() {
  const isPhone = state.authMode === "phone";
  return `
    <div class="min-h-screen bg-[#F7F7F9] flex flex-col justify-between px-6 pt-12 pb-8 animate-fade">
      <div>
        <button onclick="goScreen('splash')" class="w-11 h-11 rounded-full bg-white shadow-sm border border-slate-200/80 flex items-center justify-center text-slate-800 active:scale-95">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>

        <div class="text-center mt-8 mb-8">
          <div class="w-12 h-12 rounded-2xl bg-[#8A1538] text-white font-extrabold text-base flex items-center justify-center mx-auto mb-4 shadow-md">PS</div>
          <h1 class="text-[28px] leading-tight font-extrabold tracking-tight text-slate-900 uppercase">
            LET'S GET<br/>STARTED NOW!
          </h1>
        </div>

        <!-- Tabs -->
        <div class="flex justify-center gap-8 border-b border-slate-200 mb-6">
          <button onclick="state.authMode='phone'; state.authInput=''; render();" class="pb-3 text-xs font-extrabold tracking-wider uppercase transition ${isPhone ? 'text-[#8A1538] border-b-2 border-[#8A1538]' : 'text-slate-400'}">
            PHONE NUMBER
          </button>
          <button onclick="state.authMode='email'; state.authInput=''; render();" class="pb-3 text-xs font-extrabold tracking-wider uppercase transition ${!isPhone ? 'text-[#8A1538] border-b-2 border-[#8A1538]' : 'text-slate-400'}">
            EMAIL
          </button>
        </div>

        <!-- Input Row -->
        ${isPhone ? `
          <div class="flex items-center gap-3">
            <div class="h-14 px-4 rounded-2xl bg-white border border-slate-200/90 shadow-sm flex items-center gap-2 shrink-0">
              <span class="text-xl">🇶🇦</span>
              <span class="text-sm font-extrabold text-slate-800">+974</span>
            </div>
            <input
              type="tel"
              value="${state.authInput}"
              oninput="state.authInput=this.value"
              placeholder="Enter your phone number"
              class="w-full h-14 px-4 rounded-2xl bg-white border border-slate-200/90 shadow-sm text-sm font-semibold text-slate-900 placeholder-slate-400 focus:outline-none focus:border-[#8A1538]"
            />
          </div>
        ` : `
          <input
            type="email"
            value="${state.authInput}"
            oninput="state.authInput=this.value"
            placeholder="Enter your email address"
            class="w-full h-14 px-4 rounded-2xl bg-white border border-slate-200/90 shadow-sm text-sm font-semibold text-slate-900 placeholder-slate-400 focus:outline-none focus:border-[#8A1538]"
          />
        `}

        <p class="text-center text-xs text-slate-500 mt-4 leading-relaxed px-4">
          We will send you a one-time code via ${isPhone ? 'SMS' : 'email'} to verify your account
        </p>

        <button onclick="handleAuthContinue()" class="w-full mt-7 py-4 rounded-2xl bg-[#8A1538] hover:bg-[#70102D] active:scale-[0.99] transition text-white font-extrabold text-base shadow-lg shadow-[#8A1538]/25">
          Continue
        </button>

        <p class="text-center text-[11px] text-slate-500 mt-4">
          By clicking continue you agree to our <span class="text-[#8A1538] font-bold">Terms & Conditions</span>
        </p>
      </div>
    </div>
  `;
}

function renderOtp() {
  return `
    <div class="min-h-screen bg-[#F7F7F9] flex flex-col justify-between px-6 pt-12 pb-8 animate-fade">
      <div>
        <button onclick="goScreen('auth')" class="w-11 h-11 rounded-full bg-white shadow-sm border border-slate-200/80 flex items-center justify-center text-slate-800">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>

        <div class="text-center mt-8 mb-8">
          <h1 class="text-[26px] font-extrabold tracking-tight text-slate-900 uppercase">VERIFY CODE</h1>
          <p class="text-xs text-slate-500 mt-2">

          `).join("")}
        </div>

        <button onclick="verifyOtpAndEnter()" class="w-full py-4 rounded-2xl bg-[#8A1538] text-white font-extrabold text-base shadow-lg shadow-[#8A1538]/25 active:scale-[0.99]">
          Verify & Continue
        </button>
      </div>
    </div>
  `;
}

function renderHomeTab() {
  return `
    <div class="px-5 pt-10 pb-28 animate-fade">
      <!-- Top Header -->
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3 cursor-pointer" onclick="state.activeTab='stats'; render();">
          <img src="${state.user.avatar}" alt="Player" class="w-12 h-12 rounded-full object-cover border-2 border-[#8A1538] shadow-sm" />
          <div>
            <p class="text-[11px] font-bold uppercase tra
