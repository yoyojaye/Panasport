<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#8A1538" />
  <title>PANA SPORT — Doha Pickup Football</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0F172A; margin: 0; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-sheet { animation: slideUp 0.26s cubic-bezier(0.16, 1, 0.3, 1); }
    .animate-fade { animation: fadeIn 0.22s ease-out; }
  </style>
</head>
<body class="flex justify-center min-h-screen bg-slate-950">
<div id="app" class="w-full max-w-[430px] min-h-screen bg-[#F5F6F8] text-slate-900 relative overflow-x-hidden shadow-2xl flex flex-col"></div>

<script>
const OWNER_EMAIL = "creatbrook@gmail.com";

const PHOTOS = {
  splash: "https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&w=900&q=85",
  slide1: "https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=900&q=85",
  slide2: "https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=900&q=85",
  slide3: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=900&q=85",
  p1: "https://images.unsplash.com/photo-1529900748604-07564a03e7a6?auto=format&fit=crop&w=900&q=85",
  p2: "https://images.unsplash.com/photo-1459865264687-595d652de67e?auto=format&fit=crop&w=900&q=85",
  p3: "https://images.unsplash.com/photo-1551958219-acbc608c6377?auto=format&fit=crop&w=900&q=85",
  avatar: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=400&q=85"
};

const SLIDES = [
  { tag: "SQUAD DEAL • 6 FOR 5", title: "BRING YOUR 6,\nPAY FOR 5", sub: "Book 6 spots together & 1 player plays completely free.", img: PHOTOS.slide1, cta: "Book Squad →", matchId: "m1" },
  { tag: "DOHA FLOODLIT NIGHTS", title: "PRO TURF &\nHD HIGHLIGHTS", sub: "Recorded 8v8 & 9v9 games across Al Sadd & Lusail.", img: PHOTOS.slide2, cta: "Join Tonight →", matchId: "m1" },
  { tag: "INSTANT QATAR FAWRAN", title: "1-TAP SPOT\nCONFIRMATION", sub: "Send via Fawran, snap receipt & get verified in minutes.", img: PHOTOS.slide3, cta: "Explore Games →", matchId: "m2" }
];

const DEFAULT_DATA = {
  fawranAlias: "PANASPORT",
  fawranNumber: "+974 5512 8890",
  matches: [
    {
      id: "m1", title: "8v8 FLOODLIT PICKUP", venue: "Al Sadd Sports Complex, Doha", area: "Al Sadd",
      date: "Tonight • 20:30", duration: "90 min", price: 35, total: 16, taken: 13, recorded: true, level: "Competitive", img: PHOTOS.p1,
      players: [
        { name: "Tariq Al-Mannai", pos: "MID", rating: 88, bib: "Red" },
        { name: "Yousef K.", pos: "FWD", rating: 86, bib: "White" },
        { name: "Hamad Al-Thani", pos: "DEF", rating: 85, bib: "Red" },
        { name: "Omar N.", pos: "GK", rating: 89, bib: "White" },
        { name: "Khalid M.", pos: "MID", rating: 82, bib: "Red" },
        { name: "Faisal R.", pos: "DEF", rating: 80, bib: "White" }
      ],
      waitlist: ["Bader S."]
    },
    {
      id: "m2", title: "7v7 OPEN TURF NIGHT", venue: "Aspire Zone Pitch 4, Al Waab", area: "Al Waab",
      date: "Tomorrow • 19:00", duration: "60 min", price: 30, total: 14, taken: 10, recorded: true, level: "All Levels", img: PHOTOS.p2,
      players: [
        { name: "Nasser A.", pos: "FWD", rating: 87, bib: "Red" },
        { name: "Sami H.", pos: "MID", rating: 84, bib: "White" }
      ],
      waitlist: []
    },
    {
      id: "m3", title: "9v9 LUSAIL STADIUM TURF", venue: "Lusail Marina Fields, Doha", area: "Lusail",
      date: "Sun, 15 Nov • 21:00", duration: "90 min", price: 40, total: 18, taken: 18, recorded: false, level: "High Tempo", img: PHOTOS.p3,
      players: [{ name: "Rashid K.", pos: "DEF", rating: 88, bib: "Red" }],
      waitlist: ["Zaid M.", "Ali H."]
    }
  ],
  bookings: [
    { id: "BK-9041", matchId: "m1", matchTitle: "8v8 FLOODLIT PICKUP", playerName: "Jassim Al-Kuwari", size: 1, totalQAR: 35, method: "Fawran Transfer", status: "Pending Verification" }
  ]
};

let state = {
  screen: "splash", authMode: "phone", authInput: "", isOwner: false, otp: ["7", "4", "9", "2"],
  tab: "home", slideIdx: 0, areaFilter: "All", checkedIn: false,
  bookingMatch: null, size: 1, pay: "fawran", receiptOk: false, receiptName: "",
  menuOpen: false, editOpen: false, coachOpen: false, createMatchOpen: false, toast: null,
  coachArea: "Al Sadd", coachTempo: "Competitive",
  user: {
    name: "Tariq Al-Kuwari", phone: "+974 5589 4321", pos: "Midfielder", age: 26,
    nat: "Qatar", flag: "🇶🇦", debut: "NOV, 2026", avatar: PHOTOS.avatar, wallet: 70,
    stats: { played: 14, won: 9, lost: 5, motm: 3, goals: 11 }
  },
  data: JSON.parse(localStorage.getItem("panasport_v5")) || DEFAULT_DATA
};

const save = () => localStorage.setItem("panasport_v5", JSON.stringify(state.data));
const toast = (m) => { state.toast = m; render(); setTimeout(() => { state.toast = null; render(); }, 2600); };
const go = (s) => { state.screen = s; window.scrollTo(0, 0); render(); };

setInterval(() => {
  if (state.screen === "app" && state.tab === "home" && !state.bookingMatch && !state.menuOpen && !state.coachOpen) {
    state.slideIdx = (state.slideIdx + 1) % SLIDES.length;
    render();
  }
}, 4500);

function handleAuth() {
  const v = state.authInput.trim();
  if (!v) return toast(state.authMode === "phone" ? "Enter your phone number" : "Enter your email");
  if (state.authMode === "phone") {
    state.user.phone = "+974 " + v.replace(/^\+974\s*/, "");
    state.isOwner = false;
  } else {
    state.isOwner = v.toLowerCase() === OWNER_EMAIL.toLowerCase();
    if (!state.isOwner) state.user.name = v.split("@")[0].toUpperCase();
  }
  go("otp");
}

function verifyOtp() {
  if (state.isOwner) { go("owner"); toast("Manager Verified — Welcome!"); }
  else { go("app"); toast("Welcome to PANA SPORT Doha!"); }
}

function openBook(id) {
  state.bookingMatch = state.data.matches.find(m => m.id === id) || state.data.matches[0];
  state.size = 1; state.pay = "fawran"; state.receiptOk = false; state.receiptName = "";
  render();
}

function submitBooking() {
  const m = state.bookingMatch;
  if (!m) return;
  if (m.taken >= m.total) {
    m.waitlist.push(state.user.name); save(); state.bookingMatch = null;
    return toast("Joined priority waitlist!");
  }
  if (state.pay === "fawran" && !state.receiptOk) return toast("Upload Fawran receipt screenshot first");
  const totalQAR = (state.size === 6 ? 5 : state.size) * m.price;
  state.data.bookings.unshift({
    id: "BK-" + Math.floor(1000 + Math.random() * 9000), matchId: m.id, matchTitle: m.title,
    playerName: state.user.name + (state.size > 1 ? ` (+${state.size - 1})` : ""),
    size: state.size, totalQAR, method: state.pay === "fawran" ? "Fawran Transfer" : "Cash at Pitch",
    status: state.pay === "fawran" ? "Pending Verification" : "Confirmed (Cash)"
  });
  m.taken = Math.min(m.total, m.taken + state.size);
  m.players.push({ name: state.user.name, pos: state.user.pos.slice(0, 3).toUpperCase(), rating: 86, bib: m.players.length % 2 === 0 ? "Red" : "White" });
  save(); state.bookingMatch = null;
  toast(state.pay === "fawran" ? "Receipt sent for approval!" : "Spot reserved! Pay cash at pitch.");
}

function approveBk(id) {
  const b = state.data.bookings.find(x => x.id === id);
  if (b) { b.status = "Approved & Paid"; save(); toast(`Approved ${b.playerName}`); }
}

function rejectBk(id) {
  const i = state.data.bookings.findIndex(x => x.id === id);
  if (i > -1) {
    const b = state.data.bookings[i];
    const m = state.data.matches.find(x => x.id === b.matchId);
    if (m) m.taken = Math.max(0, m.taken - b.size);
    state.data.bookings.splice(i, 1); save(); toast("Declined & spot reopened");
  }
}

function balanceBibs(id) {
  const m = state.data.matches.find(x => x.id === id);
  if (!m) return;
  m.players.sort((a, b) => b.rating - a.rating).forEach((p, i) => p.bib = (i % 4 === 0 || i % 4 === 3) ? "Red" : "White");
  save(); toast("Bibs auto-balanced by rating!");
}

function copyLineup(id) {
  const m = state.data.matches.find(x => x.id === id) || state.data.matches[0];
  const r = m.players.filter(p => p.bib === "Red").map((p, i) => `${i + 1}. ${p.name}`).join("\n") || "1. Open";
  const w = m.players.filter(p => p.bib === "White").map((p, i) => `${i + 1}. ${p.name}`).join("\n") || "1. Open";
  navigator.clipboard?.writeText(`⚽ *PANA SPORT QATAR*\n🏟️ *${m.title}*\n📍 ${m.venue} | 🕒 ${m.date}\n\n🔴 *TEAM MAROON*\n${r}\n\n⚪ *TEAM WHITE*\n${w}\n\n📲 Join: https://yoyojaye.github.io/Panasport/`);
  toast("WhatsApp lineup copied!");
}

function createMatch(e) {
  e.preventDefault();
  const f = e.target;
  state.data.matches.unshift({
    id: "m" + Date.now(),
    title: f.title.value.trim().toUpperCase() || "8V8 NIGHT PICKUP",
    venue: f.venue.value.trim() || "Al Sadd Sports Complex, Doha",
    area: f.area.value,
    date: f.date.value.trim() || "Fri • 21:00",
    duration: "90 min",
    price: parseInt(f.price.value) || 35,
    total: parseInt(f.total.value) || 16,
    taken: 1,
    recorded: true,
    level: f.level.value,
    img: PHOTOS.p1,
    players: [{ name: "PANA Captain", pos: "MID", rating: 87, bib: "Red" }],
    waitlist: []
  });
  save(); state.createMatchOpen = false; toast("New pickup game published live!");
}

function saveProfile(e) {
  e.preventDefault();
  const f = e.target;
  state.user.name = f.fn.value.trim() || state.user.name;
  state.user.pos = f.pos.value;
  state.user.age = parseInt(f.age.value) || 25;
  state.user.nat = f.nat.value;
  const fl = { Qatar: "🇶🇦", Egypt: "🇪🇬", Jordan: "🇯🇴", Morocco: "🇲🇦", Ethiopia: "🇪🇹", India: "🇮🇳", UK: "🇬🇧", Brazil: "🇧🇷" };
  state.user.flag = fl[state.user.nat] || "🇶🇦";
  state.editOpen = false; toast("Player card updated!");
}

function render() {
  const root = document.getElementById("app");
  let html = "";

  if (state.screen === "splash") {
    html = `
      <div class="relative min-h-screen flex flex-col justify-between bg-slate-950 text-white">
        <img src="${PHOTOS.splash}" class="absolute inset-0 w-full h-full object-cover brightness-90" />
        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/55 to-black/20"></div>
        <div class="relative z-10 px-6 pt-12">
          <div class="inline-flex items-center gap-2.5 bg-black/45 backdrop-blur-md border border-white/15 px-3.5 py-2 rounded-full">
            <span class="w-7 h-7 rounded-full bg-[#8A1538] flex items-center justify-center font-extrabold text-xs">PS</span>
            <span class="text-xs font-extrabold tracking-widest">PANA SPORT</span>
          </div>
        </div>
        <div class="relative z-10 px-6 pb-10 animate-fade">
          <span class="inline-block bg-[#8A1538] text-[11px] font-extrabold tracking-widest px-3 py-1 rounded-md mb-4">🇶🇦 DOHA PICKUP FOOTBALL</span>
          <h1 class="text-[34px] leading-[1.06] font-extrabold uppercase mb-3">SHOW UP, PLAY,<br/>AND LET US<br/>HANDLE THE<br/>DETAILS</h1>
          <p class="text-sm text-slate-200 mb-7">Instant pickup slots, verified Fawran payments, and balanced Doha squads.</p>
          <button onclick="go('auth')" class="w-full py-4 rounded-2xl bg-[#8A1538] font-extrabold text-base shadow-xl">Continue</button>
        </div>
      </div>`;
  } else if (state.screen === "auth") {
    const ph = state.authMode === "phone";
    html = `
      <div class="min-h-screen bg-[#F5F6F8] px-6 pt-12 pb-8 animate-fade">
        <button onclick="go('splash')" class="w-11 h-11 rounded-full bg-white border border-slate-200 font-bold">←</button>
        <div class="text-center mt-8 mb-8">
          <div class="w-12 h-12 rounded-2xl bg-[#8A1538] text-white font-extrabold flex items-center justify-center mx-auto mb-4">PS</div>
          <h1 class="text-[28px] leading-tight font-extrabold uppercase">LET'S GET<br/>STARTED NOW!</h1>
        </div>
        <div class="flex justify-center gap-8 border-b border-slate-200 mb-6">
          <button onclick="state.authMode='phone'; state.authInput=''; render();" class="pb-3 text-xs font-extrabold uppercase ${ph ? 'text-[#8A1538] border-b-2 border-[#8A1538]' : 'text-slate-400'}">PHONE NUMBER</button>
          <button onclick="state.authMode='email'; state.authInput=''; render();" class="pb-3 text-xs font-extrabold uppercase ${!ph ? 'text-[#8A1538] border-b-2 border-[#8A1538]' : 'text-slate-400'}">EMAIL</button>
        </div>
        ${ph ? `
          <div class="flex gap-3">
            <div class="h-14 px-4 rounded-2xl bg-white border border-slate-200 flex items-center gap-2 shrink-0"><span class="text-xl">🇶🇦</span><span class="text-sm font-extrabold">+974</span></div>
            <input type="tel" value="${state.authInput}" oninput="state.authInput=this.value" placeholder="Enter your phone number" class="w-full h-14 px-4 rounded-2xl bg-white border border-slate-200 text-sm font-semibold focus:outline-none focus:border-[#8A1538]" />
          </div>` : `
          <input type="email" value="${state.authInput}" oninput="state.authInput=this.value" placeholder="Enter your email address" class="w-full h-14 px-4 rounded-2xl bg-white border border-slate-200 text-sm font-semibold focus:outline-none focus:border-[#8A1538]" />`}
        <p class="text-center text-xs text-slate-500 mt-4">We will send you a one-time code via ${ph ? 'SMS' : 'email'} to verify your account</p>
        <button onclick="handleAuth()" class="w-full mt-7 py-4 rounded-2xl bg-[#8A1538] text-white font-extrabold text-base shadow-lg">Continue</button>
        <p class="text-center text-[11px] text-slate-500 mt-4">By clicking continue you agree to our <span class="text-[#8A1538] font-bold">Terms & Conditions</span></p>
      </div>`;
  } else if (state.screen === "otp") {
    html = `
      <div class="min-h-screen bg-[#F5F6F8] px-6 pt-12 pb-8 animate-fade">
        <button onclick="go('auth')" class="w-11 h-11 rounded-full bg-white border border-slate-200 font-bold">←</button>
        <div class="text-center mt-8 mb-8">
          <h1 class="text-[26px] font-extrabold uppercase">VERIFY CODE</h1>
          <p class="text-xs text-slate-500 mt-2">Sent to <span class="font-bold text-slate-800">${state.authMode === 'phone' ? state.user.phone : state.authInput}</span></p>
        </div>
        <div class="grid grid-cols-4 gap-3 max-w-[280px] mx-auto mb-6">
          ${state.otp.map((d, i) => `<input maxlength="1" value="${d}" oninput="state.otp[${i}]=this.value" class="h-16 rounded-2xl bg-white border-2 border-[#8A1538]/30 text-center text-2xl font-extrabold" />`).join("")}
        </div>
        <button onclick="verifyOtp()" class="w-full py-4 rounded-2xl bg-[#8A1538] text-white font-extrabold text-base shadow-lg">Verify & Continue</button>
      </div>`;
  } else if (state.screen === "owner") {
    const pend = state.data.bookings.filter(b => b.status.includes("Pending")).length;
    const rev = state.data.bookings.reduce((s, b) => s + b.totalQAR, 0);
    html = `
      <div class="min-h-screen bg-slate-950 text-white px-5 pt-10 pb-12 animate-fade">
        <div class="flex items-center justify-between mb-6">
          <div><span class="text-[10px] font-extrabold tracking-widest text-emerald-400">MANAGER COMMAND CENTER</span><h1 class="text-xl font-extrabold">PANA SPORT ADMIN</h1></div>
          <div class="flex gap-2">
            <button onclick="go('app')" class="px-3 py-2 rounded-xl bg-white/10 text-xs font-extrabold">Player View</button>
            <button onclick="state.isOwner=false; go('splash');" class="px-3 py-2 rounded-xl bg-rose-500/20 text-rose-300 text-xs font-extrabold">Logout</button>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-5">
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4"><p class="text-xs text-slate-400">Match Revenue</p><p class="text-2xl font-extrabold text-emerald-400 mt-1">${rev} QR</p></div>
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4"><p class="text-xs text-slate-400">Pending Fawran</p><p class="text-2xl font-extrabold text-amber-400 mt-1">${pend}</p></div>
        </div>
        <button onclick="state.createMatchOpen=true; render();" class="w-full py-3.5 rounded-2xl bg-emerald-500 text-slate-950 font-extrabold text-sm mb-6">+ Publish New Doha Pickup Match</button>
        <h3 class="text-xs font-extrabold uppercase text-slate-400 mb-3">FAWRAN VERIFICATIONS</h3>
        <div class="space-y-3 mb-6">
          ${state.data.bookings.map(b => `
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
              <div class="flex justify-between mb-1"><span class="text-sm font-extrabold">${b.playerName}</span><span class="text-sm font-extrabold text-emerald-400">${b.totalQAR} QR</span></div>
              <p class="text-xs text-slate-400">${b.matchTitle} • ${b.method}</p>
              <div class="flex items-center justify-between mt-3 pt-3 border-t border-slate-800">
                <span class="text-[11px] font-bold ${b.status.includes('Pending') ? 'text-amber-400' : 'text-emerald-400'}">● ${b.status}</span>
                ${b.status.includes('Pending') ? `<div class="flex gap-2"><button onclick="rejectBk('${b.id}')" class="px-3 py-1.5 rounded-lg bg-rose-500/20 text-rose-300 text-xs font-extrabold">Decline</button><button onclick="approveBk('${b.id}')" class="px-3 py-1.5 rounded-lg bg-emerald-500 text-slate-950 text-xs font-extrabold">✓ Approve</button></div>` : ''}
              </div>
            </div>`).join("")}
        </div>
        <button onclick="balanceBibs('m1')" class="w-full py-3.5 rounded-2xl bg-slate-800 border border-slate-700 font-extrabold text-sm mb-2.5">⚡ Auto-Balance Tonight's Bibs</button>
        <button onclick="copyLineup('m1')" class="w-full py-3.5 rounded-2xl bg-[#8A1538] font-extrabold text-sm">📲 Copy Lineup for WhatsApp</button>
      </div>`;

    if (state.createMatchOpen) {
      html += `
        <div class="fixed inset-0 z-50 bg-black/75 flex items-end justify-center">
          <form onsubmit="createMatch(event)" class="w-full max-w-[430px] bg-slate-900 text-white rounded-t-3xl p-6 animate-sheet space-y-3.5">
            <div class="flex justify-between items-center"><h3 class="text-lg font-extrabold">New Pickup Game</h3><button type="button" onclick="state.createMatchOpen=false; render();">✕</button></div>
            <input name="title" placeholder="Match Title (e.g. 8v8 Al Sadd Night)" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-sm font-bold" />
            <div class="grid grid-cols-2 gap-2.5">
              <select name="area" class="p-3 rounded-xl bg-slate-800 border border-slate-700 text-sm font-bold"><option>Al Sadd</option><option>Al Waab</option><option>Lusail</option><option>West Bay</option></select>
              <input name="date" placeholder="Fri • 21:00" class="p-3 rounded-xl bg-slate-800 border border-slate-700 text-sm font-bold" />
            </div>
            <input name="venue" placeholder="Pitch Venue Name" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 text-sm font-bold" />
            <div class="grid grid-cols-3 gap-2">
              <input name="price" type="number" value="35" class="p-3 rounded-xl bg-slate-800 border border-slate-700
