<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>PANA SPORT — Doha Pickup Football</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *{font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
    body{background:#060B19;margin:0;color:#0F172A}
    .no-sb::-webkit-scrollbar{display:none}
    .ucl-bg{
      background-image:
        linear-gradient(180deg,rgba(248,250,252,0.82) 0%,rgba(241,245,249,0.86) 55%,rgba(226,232,240,0.90) 100%),
        url('./people-soccer-stadium_23-2151548540.avif'),
        url('https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=1000&q=85');
      background-size:cover;
      background-position:center top;
      background-attachment:fixed;
    }
    .pitch{background:repeating-linear-gradient(0deg,#10B981 0,#10B981 26px,#059669 26px,#059669 52px)}
    .fut-shield{clip-path:polygon(8% 0%,92% 0%,100% 12%,100% 76%,50% 100%,0% 76%,0% 12%)}
  </style>
</head>
<body class="flex justify-center min-h-screen">
  <div id="app" class="w-full max-w-[430px] min-h-screen ucl-bg relative overflow-x-hidden shadow-2xl flex flex-col">
    <div class="p-10 text-center text-xs font-bold text-slate-700">Loading PANA SPORT Doha...</div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
